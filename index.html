<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Personal">
<meta name="theme-color" content="#F6F5F2">
<title>Personal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F5F2; --card:#FFF; --ink:#1F1E1C; --dim:#8B8880; --line:#E6E4DE;
  --in:#2F6B4F; --out:#B4553C; --lent:#4A6E8A; --wait:#C08A3A; --owe:#8A6D3B;
  --s:'Inter',system-ui,sans-serif; --d:'Cormorant Garamond',Georgia,serif;
}
html[data-theme="dark"]{
  --bg:#141412; --card:#1D1D1A; --ink:#F0EEE8; --dim:#7C7A72; --line:#2B2B27;
  --in:#7FB894; --out:#D98A6C; --lent:#7FA8C9; --wait:#D9B06C; --owe:#C6A667;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;
  font-variant-numeric:lining-nums tabular-nums}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--s);font-size:15px;
  -webkit-font-smoothing:antialiased;padding-bottom:calc(96px + env(safe-area-inset-bottom));
  -webkit-user-select:none;user-select:none}
input,select{-webkit-user-select:text;user-select:text;font-size:16px;font-family:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left;
  touch-action:manipulation}
.wrap{max-width:460px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 18px 0}

.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.top h1{font-family:var(--d);font-size:27px;font-weight:600;line-height:1.1}
.top .sub{font-size:12px;color:var(--dim);margin-top:3px}
.iconbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);
  display:grid;place-items:center;color:var(--dim);flex:none}

.three{display:flex;flex-direction:column;gap:9px}

.cash{background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:16px 18px 15px;margin-bottom:12px}
.cash .cl{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
.cash .cv{font-family:var(--d);font-size:40px;font-weight:600;letter-spacing:-.025em;
  line-height:1.05;margin-top:5px;display:block}
.cash .cb{display:flex;gap:4px;height:5px;border-radius:4px;overflow:hidden;margin-top:13px}
.cash .cb i{display:block;border-radius:4px}
.cash .cm{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:10px;font-size:12px;color:var(--dim)}
.cash .cm span{display:flex;align-items:center;gap:5px}
.cash .cm em{font-style:normal;color:var(--ink);font-weight:500}
.cash .cm i{width:7px;height:7px;border-radius:50%;flex:none}

.big{display:flex;align-items:center;gap:14px;background:var(--card);
  border:1px solid var(--line);border-radius:16px;padding:15px 16px;width:100%;
  transition:transform .12s ease,background .15s ease}
.big:active{transform:scale(.985);background:color-mix(in srgb,var(--ink) 5%,var(--card))}
.big.on{border-color:currentColor;background:color-mix(in srgb,currentColor 8%,var(--card))}
.big .bi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.big .bt{flex:1;min-width:0}
.big .bt b{display:block;font-size:15px;font-weight:600;color:var(--ink)}
.big .bt s{text-decoration:none;font-size:12px;color:var(--dim)}
.big .bv{font-family:var(--d);font-size:26px;font-weight:600;letter-spacing:-.02em;flex:none}

.sec{font-size:12px;letter-spacing:.06em;font-variant:small-caps;color:var(--dim);
  font-weight:600;margin:26px 0 9px;display:flex;justify-content:space-between;align-items:baseline}
.sec button{font-size:12px;color:var(--ink);font-weight:600}
.mhead{display:flex;justify-content:space-between;align-items:baseline;
  padding:14px 3px 7px;position:sticky;top:0;background:var(--bg);z-index:5}
.mhead b{font-size:13px;font-weight:600}
.mhead span{font-family:var(--d);font-size:17px;font-weight:600;color:var(--dim)}
.list{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.item{display:flex;align-items:center;gap:13px;padding:13px 15px;width:100%;
  border-bottom:1px solid var(--line);transition:background .15s}
.item:last-child{border-bottom:0}
.item:active{background:color-mix(in srgb,var(--ink) 7%,transparent)}
.item .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none}
.item .tx{flex:1;min-width:0}
.item .tx b{display:block;font-size:14.5px;font-weight:500;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.item .tx s{text-decoration:none;font-size:12px;color:var(--dim)}
.item .am{font-size:15px;font-weight:600;flex:none;text-align:right;white-space:nowrap}
.empty{background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:32px 20px;text-align:center}
.empty b{display:block;font-family:var(--d);font-size:21px;font-weight:600;margin-bottom:6px}
.empty span{font-size:13px;color:var(--dim)}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--bg);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.navin{max-width:460px;margin:0 auto;display:flex}
.nav button{flex:1;text-align:center;padding:14px 0 12px;font-size:11.5px;
  font-weight:600;color:var(--dim)}
.nav button.on{color:var(--ink)}
.add{position:fixed;right:18px;bottom:calc(98px + env(safe-area-inset-bottom));z-index:45;
  width:56px;height:56px;border-radius:50%;background:var(--ink);color:var(--bg);
  display:grid;place-items:center;box-shadow:0 6px 20px rgba(0,0,0,.2)}
@media(min-width:500px){.add{right:calc(50% - 230px + 18px)}}

.sh{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:60;display:none;
  align-items:flex-end;justify-content:center}
.sh.on{display:flex}
.shin{background:var(--bg);width:100%;max-width:460px;border-radius:22px 22px 0 0;
  padding:14px 18px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;
  animation:up .25s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(30px)}to{transform:none}}
.grab{width:36px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 16px}
.shlbl{font-size:12px;letter-spacing:.05em;font-variant:small-caps;color:var(--dim);font-weight:600}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}
.pick button{padding:13px 0;border-radius:13px;border:1px solid var(--line);
  text-align:center;font-size:13.5px;font-weight:600;color:var(--dim)}
.pick button.on{color:#fff;border-color:transparent}
.pick.two{grid-template-columns:1fr 1fr}
.f{margin-top:15px;display:block}
.f span{font-size:12px;letter-spacing:.05em;font-variant:small-caps;color:var(--dim);font-weight:600}
.f input{width:100%;margin-top:7px;background:var(--card);border:1px solid var(--line);
  border-radius:13px;padding:14px;outline:none;color:var(--ink)}
.f input:focus{border-color:var(--ink)}
.f.big2 input{font-family:var(--d);font-size:32px;font-weight:600;padding:10px 14px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.chips button{display:inline-flex;align-items:center;gap:7px;padding:9px 13px;border-radius:99px;
  border:1px solid var(--line);font-size:13px;font-weight:500;color:var(--dim);background:var(--card)}
.chips button.on{color:#fff;border-color:transparent}
.chips .dash{border-style:dashed}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.go{width:100%;margin-top:20px;background:var(--ink);color:var(--bg);border-radius:14px;
  padding:16px;font-size:15px;font-weight:600;text-align:center}
.alt{width:100%;margin-top:9px;border:1px solid var(--line);border-radius:14px;padding:14px;
  font-size:14px;font-weight:600;text-align:center}
.quiet{width:100%;padding:14px;font-size:13px;color:var(--dim);text-align:center}
.danger{width:100%;padding:14px;font-size:13px;color:var(--out);text-align:center;font-weight:600}

.dv{font-family:var(--d);font-size:44px;font-weight:600;letter-spacing:-.03em;margin:6px 0 4px}
.dsub{font-size:13.5px;color:var(--dim);margin-bottom:16px}
.drow{display:flex;justify-content:space-between;gap:16px;padding:13px 0;
  border-bottom:1px solid var(--line);font-size:14px}
.drow:last-of-type{border-bottom:0}
.drow .k{color:var(--dim);flex:none}
.drow .v{font-weight:600;text-align:right;overflow-wrap:anywhere}
.prog{height:7px;border-radius:99px;background:var(--line);margin:4px 0 14px;overflow:hidden}
.prog i{display:block;height:100%;border-radius:99px}

.day{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;padding-bottom:3px}
.day::-webkit-scrollbar{display:none}
.day button{flex:none;padding:10px 16px;border-radius:99px;border:1px solid var(--line);
  background:var(--card);font-size:13.5px;font-weight:600;color:var(--dim)}
.day button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ex{background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:15px;margin-bottom:10px}
.exh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.exh b{font-size:15px;font-weight:600;line-height:1.25}
.exh s{text-decoration:none;display:block;font-size:11.5px;color:var(--dim);margin-top:2px}
.sets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:13px}
.set{border:1px solid var(--line);border-radius:12px;padding:8px 3px;text-align:center}
.set .w{display:flex;align-items:center;justify-content:center}
.set .w button{width:24px;height:26px;text-align:center;color:var(--dim);font-size:17px;line-height:1;flex:none}
.set .w span{flex:1;font-size:14.5px;font-weight:600;min-width:0}
.set .r{font-size:11.5px;color:var(--dim);margin-top:3px}
.exf{display:flex;justify-content:space-between;align-items:center;margin-top:12px;
  padding-top:11px;border-top:1px solid var(--line);font-size:12px;color:var(--dim)}
.exf button{font-size:12.5px;font-weight:600;color:var(--ink)}
.dash2{width:100%;padding:15px;border:1px dashed var(--line);border-radius:14px;
  text-align:center;font-size:13.5px;font-weight:600;color:var(--dim);margin-bottom:10px}

.toast{position:fixed;left:50%;transform:translate(-50%,24px);opacity:0;visibility:hidden;
  bottom:calc(102px + env(safe-area-inset-bottom));z-index:80;width:calc(100% - 36px);max-width:420px;
  display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--bg);
  border-radius:14px;padding:14px 16px;font-size:13.5px;font-weight:500;
  transition:transform .25s,opacity .2s,visibility .25s;box-shadow:0 8px 26px rgba(0,0,0,.2)}
.toast.on{transform:translate(-50%,0);opacity:1;visibility:visible}
.toast button{margin-left:auto;font-size:12px;font-weight:700;text-transform:uppercase;
  letter-spacing:.06em;color:var(--bg);opacity:.9;flex:none}
/* ---------- quiet pass: flat, hairline, minimal colour ---------- */
.cash{background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;
  padding:2px 2px 16px;margin-bottom:4px}
.cash .cv{font-size:34px}
.cash .cb{height:3px;gap:3px;margin-top:12px;opacity:.5}

.grp{border-bottom:1px solid var(--line)}
.ghead{display:flex;align-items:center;gap:12px;width:100%;padding:15px 2px}
.ghead:active{opacity:.5}
.ghead .gn{flex:1;min-width:0;font-size:15px;font-weight:500}
.ghead .gc{font-size:12.5px;color:var(--dim);flex:none}
.ghead .gv{font-family:var(--d);font-size:21px;font-weight:600;flex:none;min-width:84px;text-align:right}
.ghead .gx{color:var(--dim);flex:none;transition:transform .2s}
.grp.open .ghead .gx{transform:rotate(180deg)}
.grp.open .ghead .gn{font-weight:600}
.gbody{display:none;padding-bottom:6px}
.grp.open .gbody{display:block}
.gnil{padding:16px 2px 22px;font-size:13px;color:var(--dim)}

.three{gap:0;margin-bottom:12px}
.big{background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;
  padding:13px 2px;gap:12px}
.big:active{background:none;transform:none;opacity:.5}
.big.on{background:none;border-bottom-color:currentColor}
.big .bi{width:26px;height:26px;border-radius:0;background:none!important}
.big .bi svg{width:17px;height:17px;fill:currentColor!important;opacity:.8}
.big .bt b{font-size:14px;font-weight:500}
.big .bv{font-size:20px;color:var(--ink)}
.big.on .bv{color:currentColor}

.list{background:none;border:0;border-radius:0;overflow:visible}
.item{padding:11px 2px;gap:11px}
.item:active{background:none;opacity:.5}
.item .ic{width:24px;height:24px;border-radius:0;background:none!important}
.item .ic svg{width:16px;height:16px;fill:var(--dim)!important}
.item .tx b{font-size:14px;font-weight:500}
.item .am{font-size:14px;font-weight:500;color:var(--ink)!important}
.mhead{padding:18px 2px 6px}
.mhead span{font-size:15px}
.empty{background:none;border:0;border-radius:0;padding:40px 10px}

/* chips + pickers: selection is ink, not colour */
.chips button{background:none}
.chips button.on{background:var(--ink)!important;color:var(--bg);border-color:var(--ink)}
.chips button svg{fill:var(--dim)!important}
.chips button.on svg{fill:var(--bg)!important}
.pick button.on{background:var(--ink)!important;color:var(--bg);border-color:var(--ink)}

/* gym cards flatten too */
.ex{background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;
  padding:15px 2px;margin-bottom:0}
.day button{background:none}
.set{border-color:var(--line)}
.dash2{margin-top:12px}

/* folding iPhone — narrow outer screen */
@media(max-width:400px){
  .wrap{padding-left:14px;padding-right:14px}
  .cash{padding:14px 15px 13px}
  .cash .cv{font-size:33px}
  .cash .cm{gap:4px 10px;font-size:11px}
  .big{gap:10px}
  .big .bv{font-size:18px}
  .top h1{font-size:24px}
}
/* folding iPhone — unfolded, and iPad */
@media(min-width:700px){
  .wrap{max-width:720px;padding-left:24px;padding-right:24px}
  .navin{max-width:720px}
  .shin{max-width:560px}
  .cash .cv{font-size:50px}
  .three{display:grid;grid-template-columns:1fr 1fr;column-gap:28px}
  .big .bv{font-size:22px}
  #list,.sec{max-width:100%}
  .add{right:calc(50% - 360px + 24px)}
}

.selrow{align-items:center}
.selbtn{display:inline-flex;align-items:center;gap:6px;color:var(--ink);
  font-size:12px;letter-spacing:.06em;font-variant:small-caps;font-weight:600}
.selbtn svg{transition:transform .2s;color:var(--dim)}
.selbtn.open svg{transform:rotate(180deg)}
.selct{font-size:12px;color:var(--dim);font-variant:normal;letter-spacing:0}
.menu{display:none;border-top:1px solid var(--line);margin-bottom:2px}
.menu.on{display:block}
.menu button{display:flex;align-items:center;gap:11px;width:100%;padding:12px 2px;
  border-bottom:1px solid var(--line)}
.menu button:active{opacity:.5}
.menu .mk{flex:1;min-width:0;font-size:14px;font-weight:500}
.menu .mn{font-size:12px;color:var(--dim);flex:none}
.menu .mv{font-family:var(--d);font-size:17px;font-weight:600;flex:none;min-width:74px;text-align:right}
.menu .tick{width:16px;flex:none;color:var(--ink);opacity:0}
.menu button.on .tick{opacity:1}

.drow.tapr{width:100%;align-items:center;text-align:left}
.drow.tapr:active{opacity:.5}
.drow.tapr .v{flex:1}
.drow .ch{color:var(--dim);flex:none;margin-left:-4px}
.dvb{display:block;width:100%;text-align:left}
.dvb:active{opacity:.5}
.hint{font-size:12px;color:var(--dim);text-align:center;padding:14px 0 2px}

.srch{display:flex;align-items:center;gap:10px;border:1px solid var(--line);
  border-radius:14px;padding:12px 14px;background:var(--card);color:var(--dim);margin-bottom:14px}
.srch:focus-within{border-color:var(--ink);color:var(--ink)}
.srch input{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--ink);
  font-size:16px;font-family:inherit}
.srch button{color:var(--dim);display:grid;place-items:center;flex:none}
.quick{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:4px}
.quick button{padding:8px 13px;border-radius:99px;border:1px solid var(--line);
  font-size:13px;font-weight:500;color:var(--dim)}
.quick button:active{opacity:.5}
.qsum{display:flex;flex-wrap:wrap;gap:4px 18px;padding:14px 2px;border-bottom:1px solid var(--line);
  margin-top:14px}
.qsum div{min-width:0}
.qsum .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);display:block}
.qsum .v{font-family:var(--d);font-size:23px;font-weight:600}
.qnil{padding:38px 10px;text-align:center}
.qnil b{display:block;font-family:var(--d);font-size:21px;font-weight:600;margin-bottom:6px}
.qnil span{font-size:13px;color:var(--dim)}

.back{display:inline-flex;align-items:center;gap:5px;color:var(--dim);font-size:13px;
  font-weight:600;padding:2px 0 10px}
.back:active{opacity:.5}
.qtitle{display:flex;align-items:center;gap:12px;padding-bottom:4px}
.qtitle .ti{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none}
.qtitle b{font-family:var(--d);font-size:25px;font-weight:600;line-height:1.1}
.qtitle s{text-decoration:none;font-size:12.5px;color:var(--dim);margin-left:auto;flex:none}
.item .ch{color:var(--dim);flex:none;margin-left:2px}

.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.trio.two{grid-template-columns:1fr 1fr}
.trio .f{margin-top:15px}
.trio input{padding:13px 10px;font-size:15px}
.aout{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:14px;padding:13px 0 0;
  border-top:1px solid var(--line)}
.aout div{min-width:0}
.aout .k{display:block;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim)}
.aout .v{font-family:var(--d);font-size:21px;font-weight:600}

.item .am .mv{display:block;font-size:11.5px;font-weight:500;margin-top:1px}

.tv{display:none}.tv.on{display:block}
</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <div>
      <h1 id="title">Money</h1>
      <div class="sub" id="sub"></div>
    </div>
    <button class="iconbtn" id="gear" aria-label="Settings">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg>
    </button>
  </div>

  <section class="tv on" id="v-money">
    <div class="cash" id="cash"></div>
    <div class="three" id="three"></div>
    <div id="list"></div>
  </section>

  <section class="tv" id="v-assets">
    <div class="three" id="aThree"></div>
    <div class="sec"><span>What you own</span></div>
    <div id="aList"></div>
  </section>

/* split an old label like "To Raz for Belford bills" into person + reason */
function splitWho(L){
  L=(L||'').trim();
  if(!L)return {who:'Someone',why:''};
  var rest=L.replace(/^(?:to|for|paid|gave|given to|lent to)\s+/i,'');

/* ---------- MONEY ---------- */
function totals(){
  var ins=0,out=0,lent=0,owe=0;
  money.forEach(function(m){
    if(m.k==='in')ins+=m.a;
    else if(m.k==='expense')out+=m.a;
    else if(m.k==='loan')lent+=Math.max(0,m.a-(m.r||0));
    else if(m.k==='debt')owe+=Math.max(0,m.a-(m.r||0));
  });
  return {ins:ins,out:out,lent:lent,owe:owe,cash:ins-out-lent+owe};
}
var openK={};
function monthHTML(list,mode){
  var grp={},out='';
  list.slice().sort(function(a,b){return (b.d||'').localeCompare(a.d||'')})
    .forEach(function(m){var k=(m.d||'').slice(0,7);(grp[k]=grp[k]||[]).push(m)});
  Object.keys(grp).sort().reverse().forEach(function(key){
    var parts=key.split('-'),tot=0;
    grp[key].forEach(function(m){
      if(mode==='all'){if(m.k==='in')tot+=m.a;else if(m.k==='expense')tot-=m.a}
      else tot+=m.a;
    });
    var sgn=(mode==='all')?(tot>=0?'+':'−'):(mode==='in'||mode==='debt')?'+':'−';
    out+='<div class="mhead"><b>'+MF[+parts[1]-1]+' '+parts[0]+'</b>'
      +'<span>'+sgn+n0(Math.abs(tot))+'</span></div>'
      +'<div class="list">'+grp[key].map(function(m){
        var col=colour(m);
        var left=(m.k==='loan'||m.k==='debt')?Math.max(0,m.a-(m.r||0)):0;
        var sub=label(m)+' · '+dshort(m.d);
        if(m.k==='loan')sub=(m.l?label(m)+' · ':'')+(left?n0(left)+' still owed to you':'paid back in full')+' · '+dshort(m.d);
        if(m.k==='debt')sub=(m.l?label(m)+' · ':'')+(left?n0(left)+' still to repay':'cleared')+' · '+dshort(m.d);
        var sign=(m.k==='in'||m.k==='debt')?'+':'−';
        var ico=rowIcon(m,'#fff',17);
        return '<button class="item" data-id="'+m.id+'">'
          +'<span class="ic" style="background:'+col+'">'+ico+'</span>'
          +'<span class="tx"><b>'+esc(rowTitle(m))+'</b><s>'+sub+'</s></span>'
          +'<span class="am" style="color:'+col+'">'+sign+n0(m.a)+'</span></button>'}).join('')
      +'</div>';
  });
  return out;
}
function drawMoney(){
  var t=totals();
  var segs=[['var(--out)',t.out],['var(--lent)',t.lent],['var(--in)',Math.max(0,t.cash)]];
  cash.innerHTML='<span class="cl">Cash in hand</span>'
   +'<span class="cv" style="color:'+(t.cash<0?'var(--out)':'var(--ink)')+'">'
   +(t.cash<0?'−':'')+n0(Math.abs(t.cash))+'</span>'
   +'<span class="cb">'+segs.map(function(sg){
       return sg[1]>0?'<i style="background:'+sg[0]+';flex:'+sg[1]+'"></i>':''}).join('')+'</span>'
   +'<span class="cm">'
   +'<span><i style="background:var(--in)"></i>in <em>'+n0(t.ins)+'</em></span>'
   +'<span><i style="background:var(--out)"></i>spent <em>'+n0(t.out)+'</em></span>'
   +(t.lent?'<span><i style="background:var(--lent)"></i>out on loan <em>'+n0(t.lent)+'</em></span>':'')
   +(t.owe?'<span><i style="background:var(--owe)"></i>borrowed <em>'+n0(t.owe)+'</em></span>':'')
   +'</span>';

  var nIn=money.filter(function(m){return m.k==='in'}).length;
  var nOut=money.filter(function(m){return m.k==='expense'}).length;
  var nLent=money.filter(function(m){return m.k==='loan'&&m.a-(m.r||0)>0}).length;
  var big=[
   {k:'in',c:'var(--in)',t:'Received',v:t.ins,
    s:nIn+' payment'+(nIn===1?'':'s')},
   {k:'expense',c:'var(--out)',t:'Spent',v:t.out,s:nOut+' payment'+(nOut===1?'':'s')},
   {k:'loan',c:'var(--lent)',t:'Lent out',v:t.lent,
    s:nLent?nLent+' still owed to you':'all paid back'}
  ];
  if(money.some(function(m){return m.k==='debt'}))
    big.push({k:'debt',c:'var(--owe)',t:'Borrowed',v:t.owe,
      s:t.owe?'you still owe this':'all cleared'});
  three.innerHTML=big.map(function(r){
    return '<button class="big" data-f="'+r.k+'" style="color:'+r.c+'">'
     +'<span class="bi" style="background:'+r.c+'">'+icon(r.k,19)+'</span>'
     +'<span class="bt"><b>'+r.t+'</b><s>'+r.s+'</s></span>'
     +'<span class="bv">'+n0(r.v)+'</span></button>'}).join('');

  var secs=[
    {k:'all',t:'Everything',c:'var(--ink)',v:null,items:money},
    {k:'in',t:'Received',c:'var(--in)',v:t.ins,
      items:money.filter(function(m){return m.k==='in'})},
    {k:'expense',t:'Spent',c:'var(--out)',v:t.out,
      items:money.filter(function(m){return m.k==='expense'})},
    {k:'loan',t:'Lent out',c:'var(--lent)',v:t.lent,
      items:money.filter(function(m){return m.k==='loan'})}
  ];
  if(money.some(function(m){return m.k==='debt'}))
    secs.push({k:'debt',t:'Borrowed',c:'var(--owe)',v:t.owe,
      items:money.filter(function(m){return m.k==='debt'})});

  list.innerHTML=secs.map(function(sx){
    var on=!!openK[sx.k];
    return '<div class="grp'+(on?' open':'')+'" data-g="'+sx.k+'">'
      +'<button class="ghead">'
        +'<span class="gn">'+sx.t+'</span>'
        +'<span class="gc">'+sx.items.length+'</span>'
        +'<span class="gv" style="color:'+(sx.v===null?'var(--dim)':sx.c)+'">'
          +(sx.v===null?'':n0(sx.v))+'</span>'
        +'<svg class="gx" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>'
      +'</button>'
      +'<div class="gbody">'+(sx.items.length?monthHTML(sx.items,sx.k)
          :'<div class="gnil">Nothing here yet.</div>')+'</div>'
    +'</div>';
  }).join('');
}
three.addEventListener('click',function(e){
  var b=e.target.closest('[data-f]');if(!b)return;
  openSection(b.dataset.f);
});
list.addEventListener('click',function(e){
  var h=e.target.closest('.ghead');
  if(h){
    var g=h.parentNode.dataset.g;
    openK[g]=!openK[g];
    h.parentNode.classList.toggle('open',!!openK[g]);
    return;
  }
  var b=e.target.closest('[data-id]');if(!b)return;
  var m=money.filter(function(x){return ''+x.id===b.dataset.id})[0];
  openDetail(m);
});
function openSection(k){go('money');openK[k]=true;drawMoney();
  setTimeout(function(){
    var el=document.querySelector('.grp[data-g="'+k+'"]');
    if(el)el.scrollIntoView({block:'start'});
  },60);
}

var dItem=null;

function openDetail(m){
  if(!m)return;dItem=m;
  var col=colour(m);
  var left=(m.k==='loan'||m.k==='debt')?Math.max(0,m.a-(m.r||0)):0;
  var head=m.k==='in'?'Money received'
    :m.k==='loan'?'Money you lent out':m.k==='debt'?'Money you borrowed':'Money spent';
  var rows='';
  if(m.k==='loan'||m.k==='debt')
    rows+='<button class="drow tapr" data-edit="1"><span class="k">'+(m.k==='loan'?'Who you lent it to':'Who you borrowed from')+'</span><span class="v">'+esc(label(m))+'</span><svg class="ch" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>';
  rows+='<button class="drow tapr" data-edit="1"><span class="k">'+((m.k==='loan'||m.k==='debt')?'Reason':'What')+'</span><span class="v">'+esc(m.l||'—')+'</span><svg class="ch" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>';
  if(m.k==='in'||m.k==='expense')
    rows+='<button class="drow tapr" data-edit="1"><span class="k">'+(m.k==='in'?'Where from':'Category')+'</span><span class="v">'+label(m)+'</span><svg class="ch" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>';
  rows+='<button class="drow tapr" data-edit="1"><span class="k">Date</span><span class="v">'+df(m.d)+'</span><svg class="ch" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>';
  if(m.k==='loan'||m.k==='debt'){
    rows+='<div class="drow"><span class="k">'+(m.k==='loan'?'Paid back to you':'You have repaid')+'</span><span class="v">'+n0(m.r||0)+'</span></div>';
    rows+='<div class="drow"><span class="k">Still outstanding</span><span class="v" style="color:'+col+'">'+n0(left)+'</span></div>';
  }
  if(m.note)rows+='<div class="drow"><span class="k">Note</span><span class="v" style="font-weight:400">'+esc(m.note)+'</span></div>';

  dBody.innerHTML='<div class="shlbl">'+head+'</div>'
    +'<button class="dv dvb" data-edit="1" style="color:'+col+'">'+n0(m.a)+'</button>'
    +'<div class="dsub">'+esc(rowTitle(m))+'</div>'
    +(((m.k==='loan'||m.k==='debt')&&m.a)?'<div class="prog"><i style="width:'
        +Math.min(100,(m.r||0)/m.a*100)+'%;background:'+col+'"></i></div>':'')
    +rows+'<div class="hint">Tap anything above to change it</div>';

  dAct.style.display='none';dAct2.style.display='none';

    dAct.style.display='block';dAct.textContent='They paid it all back';

    dAct.style.display='block';dAct.textContent='I paid it all back';
    dAct2.style.display='block';dAct2.textContent='I paid some back';
  }
  dsh.classList.add('on');

var ATYPES=[{k:'property',n:'Property',c:'#3D5A4C'},{k:'stock',n:'Shares',c:'#4A6E8A'},
 {k:'crypto',n:'Crypto',c:'#8A6D3B'},{k:'gold',n:'Gold',c:'#9C8AA5'},
 {k:'art',n:'Art',c:'#9C6B8E'},{k:'cash',n:'Savings',c:'#6B8E6F'},
 {k:'other',n:'Other',c:'#8B8880'}];
var AM={};ATYPES.forEach(function(t){AM[t.k]=t});
var UNITY={stock:1,crypto:1,gold:1};
function isUnit(t){return !!UNITY[t]}
function nx(v,d){var x=Math.round((+v||0)*Math.pow(10,d||2))/Math.pow(10,d||2);
  return x.toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:d||2})}
function pct(i){return i.cost?((i.val-i.cost)/i.cost*100):0}
function pctTxt(i){var g=pct(i);return (g>=0?'+':'−')+Math.abs(g).toFixed(1)+'%'}
function syncUnits(i){
  if(isUnit(i.t)&&i.u>0){i.cost=i.u*(i.pb||0);i.val=i.u*(i.px||0)}
  return i;
}
inv.forEach(function(i){if(isUnit(i.t)&&i.u>0)syncUnits(i)});
function drawAssets(){
  var val=0,cost=0,pval=0,gifts=0;
  inv.forEach(function(i){

    +'<span class="bi" style="background:var(--in)"><svg width="19" height="19" viewBox="0 0 24 24" fill="#fff"><path d="M3 20.5h18V22H3zM4.5 18.8V13l4.6-4.6 3.4 3.4L20 4.6v14.2z"/></svg></span>'
    +'<span class="bt"><b>What you own</b><s>'
    +(cost?((pval>=cost?'up ':'down ')+n0(Math.abs(pval-cost))+' on '+n0(cost)+' paid · '
            +((pval-cost)/cost>=0?'+':'−')+Math.abs((pval-cost)/cost*100).toFixed(1)+'%'
            +(gifts?' · '+gifts+' given to you':''))
          :(inv.length+' thing'+(inv.length===1?'':'s')+' · nothing paid for them'))
    +'</s></span><span class="bv">'+n0(val)+'</span></button>';
  if(t.lent>0)h+='<button class="big" style="color:var(--lent)" data-golent="1">'
    +'<span class="bi" style="background:var(--lent)">'+icon('loan',19)+'</span>'
    +'<span class="bt"><b>Owed back to you</b><s>tap to see who</s></span>'
    +'<span class="bv">'+n0(t.lent)+'</span></button>';

  aList.innerHTML=inv.length

        var ty=AM[i.t]||AM.other, g=i.val-i.cost;
        var sub=isUnit(i.t)&&i.u>0
          ? nx(i.u,4)+' × '+nx(i.px)+' · bought at '+nx(i.pb)

        var mv=i.cost?('<span class="mv" style="color:'+(g>=0?'var(--in)':'var(--out)')+'">'

    : '<div class="empty"><b>Nothing added yet</b><span>Add a property, shares, crypto, gold or art and see what it is all worth together.</span></div>';
}

/* ---------- BROWSE + SEARCH ---------- */
var qTerm='',qTag=null;

function tagItems(id){
  if(id.indexOf('p:')===0)return money.filter(function(m){
    return (m.k==='loan'||m.k==='debt')&&(m.p||'')===id.slice(2)});
  if(id.indexOf('e:')===0)return money.filter(function(m){
    return m.k==='expense'&&((m.e||'misc')===id.slice(2))});
  return money.filter(function(m){return m.k==='in'&&((m.c||'other')===id.slice(2))});
}
function tagMeta(id){
  if(id.indexOf('p:')===0){
    var pp=PM[id.slice(2)]||{n:'Someone',c:'#4A6E8A'};
    return {n:pp.n,c:pp.c,w:'person'};
  }
  if(id.indexOf('e:')===0){var cc=CM[id.slice(2)]||CM.misc;return {n:cc.n,c:cc.c,w:'expense'}}
  var sc=SM[id.slice(2)]||SM.other;return {n:sc.n,c:sc.c,w:'in'};
}
function tagIcon(m,col,size){
  if(!m)return svg(PSVG,col||'#fff',size||17);
  if(m.k==='loan'||m.k==='debt')return svg(PSVG,col||'#fff',size||17);
  return rowIcon(m,col||'#fff',size||17);
}
function hay(m){
  var kn=m.k==='in'?'received income in'
    :m.k==='expense'?'spent expense out'
    :m.k==='loan'?'lent loan owed to me':'borrowed debt owe';
  return [rowTitle(m),label(m)||'',m.note||'',kn,''+m.a,(m.d||'')].join(' ').toLowerCase();
}
function hayA(h){
  var t=AM[h.t]||ATYPES[ATYPES.length-1];
  return [h.l||'',t.n,''+(h.val||0),''+(h.cost||0)].join(' ').toLowerCase();
}
function sumUp(list){
  var o={n:list.length,inn:0,out:0,lent:0,owe:0};
  list.forEach(function(m){
    if(m.k==='in')o.inn+=m.a;
    else if(m.k==='expense')o.out+=m.a;
    else if(m.k==='loan'){o.out+=0;o.lent+=Math.max(0,m.a-(m.r||0))}
    else if(m.k==='debt')o.owe+=Math.max(0,m.a-(m.r||0));
  });
  return o;
}
function sumCells(o){
  var c=[];
  if(o.inn)c.push(['Received','var(--in)',o.inn]);
  if(o.out)c.push(['Spent','var(--out)',o.out]);
  if(o.lent)c.push(['Still owed to you','var(--lent)',o.lent]);
  if(o.owe)c.push(['You still owe','var(--owe)',o.owe]);
  return '<div class="qsum">'+c.map(function(x){
    return '<div><span class="k">'+x[0]+'</span><span class="v" style="color:'+x[1]+'">'+n0(x[2])+'</span></div>'
  }).join('')+'</div>';
}
function rowsHTML(list){
  list=list.slice().sort(function(a,b){return (b.d||'').localeCompare(a.d||'')});
  return '<div class="list">'+list.map(function(m){
    var col=colour(m);
    var left=(m.k==='loan'||m.k==='debt')?Math.max(0,m.a-(m.r||0)):0;
    var sub=label(m)+' · '+dshort(m.d);
    if(m.k==='loan')sub=(m.l?label(m)+' · ':'')+(left?n0(left)+' still owed to you':'paid back in full')+' · '+dshort(m.d);
    if(m.k==='debt')sub=(m.l?label(m)+' · ':'')+(left?n0(left)+' still to repay':'cleared')+' · '+dshort(m.d);
    var sign=(m.k==='in'||m.k==='debt')?'+':'−';
    var ico=tagIcon(m,'#fff',17);
    return '<button class="item" data-id="'+m.id+'">'
      +'<span class="ic" style="background:'+col+'">'+ico+'</span>'
      +'<span class="tx"><b>'+esc(rowTitle(m))+'</b><s>'+sub+'</s></span>'
      +'<span class="am" style="color:'+col+'">'+sign+n0(m.a)+'</span></button>'}).join('')+'</div>';
}
function assetsHTML(list){
  return '<div class="list">'+list.map(function(x){
    var ty=AM[x.t]||ATYPES[ATYPES.length-1];
    return '<button class="item" data-aid="'+x.id+'">'
     +'<span class="ic" style="background:'+ty.c+'">'+svg(ATSVG[ty.k]||ATSVG.other,'#fff',17)+'</span>'
     +'<span class="tx"><b>'+esc(x.l||'Untitled')+'</b><s>'+ty.n+'</s></span>'
     +'<span class="am">'+n0(x.val||0)+'</span></button>'}).join('')+'</div>';
}

function drawSearch(){
  var t=qTerm.trim().toLowerCase();
  qCx.style.display=t?'grid':'none';

  /* --- drilled into one name --- */
  if(qTag&&!t){
    var list=tagItems(qTag);
    if(!list.length){qTag=null;drawSearch();return}
    var tg=tagMeta(qTag),o=sumUp(list);
    qHead.innerHTML='<button class="back" id="qBack">'
      +'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>All names</button>'
      +'<div class="qtitle"><span class="ti" style="background:'+tg.c+'">'
      +(tg.w==='person'?svg(PSVG,'#fff',18):tagIcon(list[0],'#fff',18))+'</span>'
      +'<b>'+esc(tg.n)+'</b><s>'+o.n+' payment'+(o.n===1?'':'s')+'</s></div>';
    qSum.innerHTML=sumCells(o);
    qRes.innerHTML=rowsHTML(list);
    return;
  }

  /* --- typed search --- */
  if(t){
    qHead.innerHTML='';
    var hits=money.filter(function(m){return hay(m).indexOf(t)>=0});
    var ah=inv.filter(function(x){return hayA(x).indexOf(t)>=0});
    if(!hits.length&&!ah.length){
      qSum.innerHTML='';
      qRes.innerHTML='<div class="qnil"><b>Nothing matches “'+esc(qTerm)+'”</b>'
        +'<span>Try part of a name, a category, or an amount.</span></div>';
      return;
    }
    var o2=sumUp(hits);
    qSum.innerHTML='<div class="sec"><span>'+(hits.length+ah.length)+' match'
      +((hits.length+ah.length)===1?'':'es')+'</span></div>'+(hits.length?sumCells(o2):'');
    qRes.innerHTML=(ah.length?'<div class="sec"><span>What you own</span></div>'+assetsHTML(ah):'')
      +(hits.length?'<div class="sec"><span>Payments</span></div>'+rowsHTML(hits):'');
    return;
  }

  /* --- the list of every name --- */
  qHead.innerHTML='';qSum.innerHTML='';
  if(!money.length){
    qRes.innerHTML='<div class="qnil"><b>Nothing to browse yet</b>'
      +'<span>Once you add payments, every name and category shows up here.</span></div>';
    return;
  }
  var cats={},srcs={},pers={};
  money.forEach(function(m){
    if(m.k==='expense'){var k=m.e||'misc';(cats[k]=cats[k]||[]).push(m)}
    else if(m.k==='in'){var c=m.c||'other';(srcs[c]=srcs[c]||[]).push(m)}
    else {var w=m.p||'someone';(pers[w]=pers[w]||[]).push(m)}
  });
  function block(title,entries){
    if(!entries.length)return '';
    entries.sort(function(x,y){return y.tot-x.tot});
    return '<div class="sec"><span>'+title+'</span></div><div class="list">'
      +entries.map(function(e){
        var o=sumUp(e.items);
        var note=o.lent?n0(o.lent)+' still owed to you'
          :o.owe?n0(o.owe)+' still to repay'
          :e.items.length+' payment'+(e.items.length===1?'':'s');
        return '<button class="item" data-tag="'+esc(e.id)+'">'
          +'<span class="ic" style="background:'+e.c+'">'+e.ico+'</span>'
          +'<span class="tx"><b>'+esc(e.n)+'</b><s>'+note+'</s></span>'
          +'<span class="am">'+n0(e.tot)+'</span>'
          +'<svg class="ch" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>'
          +'</button>'}).join('')+'</div>';
  }
  var pe=Object.keys(pers).map(function(k){
    var pp=PM[k]||{n:'Someone',c:'#4A6E8A'};
    return {id:'p:'+k,n:pp.n,c:pp.c,items:pers[k],ico:svg(PSVG,'#fff',17),
            tot:pers[k].reduce(function(a,m){return a+m.a},0)}});
  var ce=Object.keys(cats).map(function(k){
    var cc=CM[k]||CM.misc;
    return {id:'e:'+k,n:cc.n,c:cc.c,items:cats[k],ico:svg(CSVG[k]||CSVG.misc,'#fff',17),
            tot:cats[k].reduce(function(a,m){return a+m.a},0)}});
  var se=Object.keys(srcs).map(function(k){
    var sc=SM[k]||SM.other;
    return {id:'s:'+k,n:sc.n,c:sc.c,items:srcs[k],ico:svg(SSVG[k]||SSVG.other,'#fff',17),
            tot:srcs[k].reduce(function(a,m){return a+m.a},0)}});
  qRes.innerHTML=block('People',pe)+block('Categories',ce)+block('Money coming in',se);
}

ssh.onclick=function(e){if(e.target===ssh)ssh.classList.remove('on')};
themeBtn.onclick=function(){
  var t=(document.documentElement.dataset.theme==='dark')?'light':'dark';
  document.documentElement.dataset.theme=t;S.s('p3_th',t);
  themeBtn.textContent=(t==='dark')?'Switch to light':'Switch to dark';
};
expBtn.onclick=function(){
  var blob={v:15,at:new Date().toISOString(),money:money,inv:inv,gym:gym,ses:ses,cats:CATS,people:PEOPLE};
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(blob)],{type:'application/json'}));
  a.download='personal-backup-'+todayStr()+'.json';a.click();
  toast('Backup saved to your downloads');
};
impBtn.onclick=function(){impFile.click()};
impFile.onchange=function(e){
  var f=e.target.files&&e.target.files[0];if(!f)return;
  var rd=new FileReader();
  rd.onload=function(){
    var d;try{d=JSON.parse(rd.result)}catch(err){return toast('That file could not be read')}
    if(!d||!Array.isArray(d.money))return toast('That is not a Personal backup');
    money=d.money.map(function(m){
      var o={};for(var k in m)o[k]=m[k];
      o.a=+m.a||0;o.r=+m.r||0;
      if(o.e==='familyx')o.e='family';
      if(o.k==='refund'){o.k='expense'}
      return o;
    });
    if(Array.isArray(d.inv))inv=d.inv.map(function(i){
      var u=(+i.u)||1;
      return {id:i.id||Date.now()+Math.random(),l:i.l||'Untitled',t:i.t||'other',
        cost:isFinite(+i.cost)?((+i.cost)*(i.px!==undefined?u:1)):(+i.a||0),
        val:(i.px!==undefined)?((+i.px)*u):(isFinite(+i.val)?+i.val:(+i.v||0)),
        note:i.note,d:i.since||i.d||i.up||todayStr()};
    });
    if(d.gym)gym=d.gym;
    Object.keys(gym).forEach(function(k){var g=gym[k];g.n=g.n||g.name||k;
      g.ex=Array.isArray(g.ex)?g.ex:[]});
    if(Array.isArray(d.ses))ses=d.ses;
    if(Array.isArray(d.cats)&&d.cats.length){CATS=d.cats;remap()}
    if(Array.isArray(d.people))     {PEOPLE=d.people;premap()}
    money=money.filter(function(m){return !(m.k==='in'&&m.pend)});
    money.forEach(function(m){delete m.pend});
    money.forEach(function(m){
      if((m.k==='loan'||m.k==='debt')&&!m.p){var sp=splitWho(m.l);m.p=addPerson(sp.who);m.l=sp.why||''}
    });
      ssh.classList.remove('on');R();toast('Backup restored');
  };
  rd.readAsText(f);e.target.value='';
};
catsBtn.onclick=function(){ssh.classList.remove('on');openCats()};
function cMgr_(){
  cMgr.innerHTML=CATS.map(function(c){
    var used=money.filter(function(m){return m.k==='expense'&&m.e===c.k}).length;
    return '<div class="drow"><span class="k" style="display:flex;align-items:center;gap:10px;flex:1">'
      +'<span style="width:28px;height:28px;border-radius:9px;background:'+c.c
      +';display:grid;place-items:center;flex:none">'+svg(CSVG[c.k]||CSVG.misc,'#fff',15)+'</span>'
      +'<span style="color:var(--ink);font-weight:500">'+esc(c.n)+'</span>'
      +'<span style="font-size:11.5px">'+(used?(used+' used'):'')+'</span></span>'
      +(c.k==='misc'?'<span class="v" style="color:var(--dim);font-weight:400">kept</span>'
        :'<button data-dc="'+c.k+'" style="color:var(--out);font-size:12.5px;font-weight:600;flex:none">Remove</button>')
      +'</div>'}).join('');
}
function pMgr_(){
  pMgr.innerHTML=PEOPLE.length?PEOPLE.map(function(x){
    var used=money.filter(function(m){return (m.k==='loan'||m.k==='debt')&&m.p===x.k}).length;
    return '<div class="drow"><span class="k" style="display:flex;align-items:center;gap:10px;flex:1">'
      +'<span style="width:28px;height:28px;border-radius:9px;background:'+x.c
      +';display:grid;place-items:center;flex:none">'+svg(PSVG,'#fff',15)+'</span>'
      +'<span style="color:var(--ink);font-weight:500">'+esc(x.n)+'</span>'
      +'<span style="font-size:11.5px">'+(used?(used+' used'):'')+'</span></span>'
      +(used?'<span class="v" style="color:var(--dim);font-weight:400">in use</span>'
        :'<button data-dp="'+x.k+'" style="color:var(--out);font-size:12.5px;font-weight:600;flex:none">Remove</button>')
      +'</div>'}).join(''):'<div class="drow"><span class="k">Nobody yet</span></div>';
}
pAdd.onclick=function(){
  var n=pNew.value.trim();if(!n){pNew.focus();return}
  addPerson(n);pNew.value='';pMgr_();R();toast('Added '+n);
};
pMgr.addEventListener('click',function(e){
  var b=e.target.closest('[data-dp]');if(!b)return;
  var x=PM[b.dataset.dp];if(!x)return;
  var at=PEOPLE.indexOf(x);if(at<0)return;
  PEOPLE.splice(at,1);premap();pMgr_();R();
  toast('Removed '+x.n,function(){PEOPLE.splice(at,0,x);premap();pMgr_();R()});
});
function openCats(){cMgr_();pMgr_();cNew.value='';pNew.value='';csh.classList.add('on')}
cCx.onclick=function(){csh.classList.remove('on')};
csh.onclick=function(e){if(e.target===csh)csh.classList.remove('on')};
cAdd.onclick=function(){
  var n=cNew.value.trim();if(!n){cNew.focus();return}
  var k=n.toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,12)||('c'+Date.now());
  while(CATS.some(function(c){return c.k===k}))k+='x';
  CATS.splice(CATS.length-1,0,{k:k,n:n,c:PAL[CATS.length%PAL.length]});
  remap();cNew.value='';cMgr_();R();toast('Added '+n);
};
cMgr.addEventListener('click',function(e){
  var b=e.target.closest('[data-dc]');if(!b)return;
  var k=b.dataset.dc;
  var c=CATS.filter(function(x){return x.k===k})[0];
  if(!c)return;
  var at=CATS.indexOf(c);
  var used=money.filter(function(m){return m.k==='expense'&&m.e===k});
  var before=used.map(function(m){return {m:m,e:m.e}});
  used.forEach(function(m){m.e='misc'});
  CATS.splice(at,1);remap();cMgr_();R();
  toast('Removed '+c.n,function(){
    CATS.splice(at,0,c);before.forEach(function(x){x.m.e=x.e});remap();cMgr_();
  });
});

/* ---------- nav ---------- */
var NAMES={money:'Money',assets:'Assets',search:'Search'};
function go(t){
  [].slice.call(document.querySelectorAll('.sh')).forEach(function(x){x.classList.remove('on')});
  [].slice.call(document.querySelectorAll('.nav button')).forEach(function(b){
    b.classList.toggle('on',b.dataset.t===t)});
  [].slice.call(document.querySelectorAll('.tv')).forEach(function(v){
    v.classList.toggle('on',v.id==='v-'+t)});
  title.textContent=NAMES[t];
  add.style.display=(t==='search')?'none':'grid';
  if(t==='search')setTimeout(function(){try{q.focus()}catch(e){}},120);
  add.onclick=(t==='assets')?function(){openAsset(null)}:function(){openSheet(null)};
  window.scrollTo({top:0});
}
[].slice.call(document.querySelectorAll('.nav button')).forEach(function(b){
  b.onclick=function(){go(b.dataset.t)};
});
add.onclick=function(){openSheet(null)};

/* ---------- go ---------- */
function R(){drawMoney();drawAssets();drawSearch();saveAll()}
var th=S.g('p3_th');if(th)document.documentElement.dataset.theme=th;
var hh=new Date().getHours();
sub.textContent=(hh<12?'Good morning':hh<18?'Good afternoon':'Good evening')+' · '
  +new Date().toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
R();

/* clear any service worker left by the old version */
if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(function(rs){
    var had=false;rs.forEach(function(r){had=true;r.unregister()});
    if(had&&window.caches&&caches.keys)
      caches.keys().then(function(ks){return Promise.all(ks.map(function(k){return caches.delete(k)}))})
        .then(function(){location.reload()});
  })['catch'](function(){});
}
</script>
